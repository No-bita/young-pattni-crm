# Springboard v1 Worker configuration.
# Every REPLACE_ value is a placeholder: fill it in after you create the resources in the NEW
# Springboard Cloudflare account. Nothing here points at Alma, Collectr or Lekho resources.
#
# Secrets are NOT stored in this file. Add them with `wrangler secret put` only AFTER the
# placeholders below are filled in (each `secret put` deploys a new version immediately):
#   META_APP_SECRET       Meta app secret, used to verify webhook signatures
#   META_VERIFY_TOKEN     a random string you also enter in Meta's webhook settings
#   WA_TOKEN_<REF>        one per WhatsApp number, e.g. WA_TOKEN_MAIN (REF is entered on the Number screen)

name = "majboot-pattni"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
GRAPH_API_VERSION = "v23.0"
MAX_CAMPAIGN_AUDIENCE = "1000"   # per-campaign recipient cap
SEND_INTERVAL_MS = "100"         # pause between sends inside a queue batch (~10 per second)

[[d1_databases]]
binding = "DB"
database_name = "young_pattni_crm"
database_id = "a3d8e74e-83ea-45b1-854c-bf8133b23596"
migrations_dir = "migrations"

# Private R2 bucket for incoming photos/voice notes and stored header images.
# Create it in the Springboard Cloudflare account (no public access, no custom domain), then fill the name.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "replace-me-media-bucket"   # placeholder: create the private bucket, then put its real name here

[[queues.producers]]
binding = "CAMPAIGN_QUEUE"
queue = "springboard-test-send-queue"

[[queues.consumers]]
queue = "springboard-test-send-queue"
max_batch_size = 10
max_batch_timeout = 1
max_concurrency = 1
max_retries = 3
# The same queue also carries background downloads of incoming media ({ type: "inbound_media" }).

[triggers]
crons = ["* * * * *"]            # launches scheduled campaigns when they fall due

[observability]
enabled = true
